<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOP — Prototipo lampada 3D</title>
<style>
  @font-face { font-family: "Lemon Milk"; src: url(../font/LemonMilk-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Garet"; src: url(../font/Garet-Book.woff2) format("woff2"); font-weight: 400; font-display: swap; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0a09;
    color: #f3efe8;
    font: 400 16px/1.5 Garet, system-ui, sans-serif;
    overflow: hidden;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  .fallback { position: fixed; inset: 0; display: none; }
  .fallback img { width: 100%; height: 100%; object-fit: cover; }
  body.no-webgl .fallback { display: block; }

  header { position: fixed; top: 24px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: start; pointer-events: none; }
  header img { width: 64px; filter: invert(1); }
  header p { font-family: "Lemon Milk"; font-size: 11px; letter-spacing: .16em; opacity: .6; text-align: right; }

  .ui {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; border-radius: 99px;
    background: rgba(255,255,255,.07); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
  }
  .ui button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .pill { font-family: "Lemon Milk"; font-size: 11px; letter-spacing: .12em; padding: 10px 16px; border-radius: 99px; background: rgba(255,255,255,.1); transition: background .2s; white-space: nowrap; }
  .pill:hover { background: rgba(255,255,255,.18); }
  .pill[aria-pressed="true"] { background: #f3c300; color: #0b0a09; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; background-size: cover; outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .2s, transform .2s; }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { outline-color: #f3efe8; }
  .swatch.colore { width: 24px; height: 24px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .sep { width: 1px; height: 24px; background: rgba(255,255,255,.15); }

  /* intensità della luce */
  .dimmer { display: flex; align-items: center; gap: 10px; }
  .dimmer svg { width: 16px; height: 16px; opacity: .7; flex: none; }
  .dimmer input { -webkit-appearance: none; appearance: none; width: 110px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #f3c300 var(--v, 80%), rgba(255,255,255,.18) var(--v, 80%)); cursor: pointer; }
  .dimmer input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #f3efe8; border: 0; }
  .dimmer input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #f3efe8; border: 0; }
  .dimmer input:focus-visible { outline: 2px solid #f3c300; outline-offset: 4px; }

  .hint { position: fixed; bottom: 96px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .45; pointer-events: none; transition: opacity .4s; }

  @media (max-width: 860px) {
    .ui { flex-wrap: wrap; justify-content: center; width: calc(100% - 32px); border-radius: 24px; gap: 10px 12px; padding: 12px; bottom: 16px; }
    .ui .sep { display: none; }
    .pill { padding: 9px 12px; font-size: 10px; }
    .swatch { width: 30px; height: 30px; }
    .dimmer { width: 100%; justify-content: center; }
    .dimmer input { width: min(240px, 60vw); }
    .hint { bottom: 190px; }
  }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"
  } }
</script>
</head>
<body>

<div class="fallback"><img src="foto-fallback.webp" alt="Lampada LOOP accesa"></div>

<header>
  <img src="../logo/loop-logo.svg" alt="LOOP">
  <p>Prototipo<br>lampada 3D</p>
</header>

<p class="hint">Trascina per girare la lampada</p>

<div class="ui">
  <button class="pill" id="power" aria-pressed="true">Accesa</button>
  <label class="dimmer" title="Intensità della luce">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input type="range" id="intensita" min="0" max="100" value="80" aria-label="Intensità della luce">
  </label>
  <span class="sep"></span>
  <div class="swatches" id="swatches" aria-label="Bioplastica"></div>
  <span class="sep"></span>
  <div class="swatches" id="colori" aria-label="Colore struttura"></div>
  <span class="sep"></span>
  <button class="pill" id="stack" aria-pressed="false">Impila</button>
</div>

<script type="module">
  import * as THREE from "three";

  // Bioplastiche disponibili: aggiungere qui le nuove texture (512px, webp)
  const BIOPLASTICHE = [
    { id: "pois",    src: "tex/pois.webp" },
    { id: "rossa",   src: "tex/rossa.webp" },
    { id: "cielo",   src: "tex/cielo.webp" },
    { id: "corallo", src: "tex/corallo.webp" },
  ];

  // Colori della struttura, come nei render della tesi (verniciatura a polvere)
  const STRUTTURE = [
    { id: "alluminio", colore: 0xc9c8c4, metallo: 0.35, ruvido: 0.45 },
    { id: "giallo",    colore: 0xf3c300, metallo: 0.05, ruvido: 0.55 },
    { id: "arancione", colore: 0xf0601c, metallo: 0.05, ruvido: 0.55 },
    { id: "bianco",    colore: 0xecebe7, metallo: 0.05, ruvido: 0.6 },
    { id: "nero",      colore: 0x1d1d1d, metallo: 0.1,  ruvido: 0.6 },
  ];

  const canvas = document.createElement("canvas");
  if (!(canvas.getContext("webgl2") || canvas.getContext("webgl"))) {
    document.body.classList.add("no-webgl");
    throw new Error("WebGL non disponibile");
  }
  document.body.prepend(canvas);

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "low-power" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x0b0a09);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, 1, 1, 600);

  const ambiente = new THREE.HemisphereLight(0xffffff, 0x2a2420, 1.1);
  const key = new THREE.DirectionalLight(0xffffff, 1.3);
  key.position.set(20, 30, 25);
  scene.add(ambiente, key);

  // ---- Materiali ----
  const loader = new THREE.TextureLoader();
  const textures = {};
  function getTexture(b) {
    if (!textures[b.id]) {
      textures[b.id] = loader.load(b.src, render);
      textures[b.id].colorSpace = THREE.SRGBColorSpace;
    }
    return textures[b.id];
  }
  const alluminio = new THREE.MeshStandardMaterial();
  const cornice = new THREE.MeshStandardMaterial();
  const ferro = new THREE.MeshStandardMaterial({ color: 0x55534f, metalness: 0.5, roughness: 0.6 });
  // le fessure degli incastri: da accesa ci passa la luce interna
  const fessuraMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
  function impostaStruttura(s) {
    alluminio.color.setHex(s.colore); alluminio.metalness = s.metallo; alluminio.roughness = s.ruvido;
    cornice.color.setHex(s.colore); cornice.metalness = s.metallo + 0.05; cornice.roughness = s.ruvido + 0.1;
    render();
  }

  // ---- Un cubo LOOP: 12 cm, cornici da 1 cm, finestra 10 cm ----
  // 4 lati + coperchio in alluminio, base in ferro (la lampadina magnetica si aggancia lì)
  const S = 12, T = 0.15, W = 10;
  // i pannelli pieni stanno tra le due cornici, così non si sovrappongono negli spigoli
  const pannelloLato = new THREE.BoxGeometry(S - 0.62, S, T);
  const pannelloOrizz = new THREE.BoxGeometry(S, S - 0.62, T);
  const telaio = (() => {
    const shape = new THREE.Shape();
    shape.moveTo(-S/2, -S/2); shape.lineTo(S/2, -S/2); shape.lineTo(S/2, S/2); shape.lineTo(-S/2, S/2);
    const hole = new THREE.Path();
    hole.moveTo(-W/2, -W/2); hole.lineTo(-W/2, W/2); hole.lineTo(W/2, W/2); hole.lineTo(W/2, -W/2);
    shape.holes.push(hole);
    return new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false });
  })();
  const finestra = new THREE.PlaneGeometry(W, W);
  // due fessure per pannello, parallele alle finestre (come nei disegni tecnici)
  const fessuraLato = new THREE.BoxGeometry(0.18, 4.5, T + 0.02);
  const fessuraOrizz = new THREE.BoxGeometry(4.5, 0.18, T + 0.02);

  function creaCubo(bio) {
    const g = new THREE.Group();
    for (const [axis, sign] of [["x", 1], ["x", -1], ["y", 1], ["y", -1]]) {
      const base = axis === "y" && sign < 0;
      const m = new THREE.Mesh(axis === "x" ? pannelloLato : pannelloOrizz, base ? ferro : alluminio);
      if (axis === "x") { m.rotation.y = Math.PI / 2; m.position.x = sign * (S/2 - T/2); }
      else { m.rotation.x = Math.PI / 2; m.position.y = sign * (S/2 - T/2); }
      if (!base) for (const k of [1, -1]) {
        const f = new THREE.Mesh(axis === "x" ? fessuraLato : fessuraOrizz, fessuraMat);
        if (axis === "x") f.position.x = k * 4.4; else f.position.y = k * 4.4;
        m.add(f);
      }
      g.add(m);
    }
    // i due lati a cornice: davanti e dietro (le calamite stanno nascoste sotto la cornice in ferro)
    const bioMat = new THREE.MeshBasicMaterial({ map: getTexture(bio), side: THREE.DoubleSide });
    for (const sign of [1, -1]) {
      const lato = new THREE.Group();
      lato.add(new THREE.Mesh(telaio, cornice));
      const p = new THREE.Mesh(finestra, bioMat);
      p.position.z = -0.05;
      lato.add(p);
      lato.position.z = sign * (S/2 - 0.3);
      if (sign < 0) lato.rotation.y = Math.PI;
      g.add(lato);
    }
    g.userData.bioMat = bioMat;
    return g;
  }

  // ---- Luce finta, niente calcoli di illuminazione in tempo reale ----
  function sfumatura(stops) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, a]) => g.addColorStop(o, `rgba(255,255,255,${a})`));
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const morbida = sfumatura([[0, 1], [0.25, .6], [0.5, .22], [0.75, .06], [1, 0]]);
  const additiva = (opacity) => new THREE.MeshBasicMaterial({ map: morbida, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity });

  // ombra sotto la lampada
  const ombra = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d");
    const grd = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, "rgba(0,0,0,.7)"); grd.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = grd; x.fillRect(0, 0, 128, 128);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = -S/2 + 0.03;
    return m;
  })();

  // il muro dietro la lampada: la finestra rivolta verso il muro lo tinge del colore della bioplastica
  const MURO_Z = -30;
  const muroMat = additiva(0);
  const macchiaMuro = new THREE.Mesh(new THREE.PlaneGeometry(90, 70), muroMat);
  macchiaMuro.position.z = MURO_Z;
  // pavimento: la luce che esce dalle finestre lo colora davanti e dietro (ruota con la lampada)
  // la sfumatura parte dal bordo della finestra e si apre a ventaglio, così la luce "esce" dalla lampada
  const ventaglio = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d");
    // ellisse: arriva a zero sia sui lati sia in fondo, niente bordi netti
    x.scale(1, 2);
    const g = x.createRadialGradient(64, 0, 0, 64, 0, 64);
    [[0, 1], [0.2, .55], [0.45, .2], [0.7, .05], [1, 0]].forEach(([o, a]) => g.addColorStop(o, `rgba(255,255,255,${a})`));
    x.fillStyle = g; x.fillRect(0, 0, 128, 64);
    return new THREE.CanvasTexture(c);
  })();
  const pavimentoMat = [0, 1].map(() => new THREE.MeshBasicMaterial({ map: ventaglio, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
  const pozze = new THREE.Group();
  [1, -1].forEach((sign, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(26, 20), pavimentoMat[i]);
    m.rotation.x = -Math.PI / 2;
    if (sign < 0) m.rotation.z = Math.PI;
    m.position.set(0, -S/2 + 0.02, sign * (S/2 - 0.5 + 10));
    pozze.add(m);
  });
  scene.add(macchiaMuro);

  const lampada = new THREE.Group();
  lampada.add(ombra, pozze);
  scene.add(lampada);

  // ---- Stato ----
  let cubi = [];
  let accesa = true;
  let intensita = 0.8;
  let corrente = BIOPLASTICHE[0];
  const coloreLuce = new THREE.Color(0xf2a33a);
  const buio = new THREE.Color(0x0a0a0a);

  function costruisci(impila) {
    cubi.forEach(c => lampada.remove(c));
    const n = impila ? 3 : 1;
    cubi = Array.from({ length: n }, (_, i) => {
      const bio = BIOPLASTICHE[(BIOPLASTICHE.indexOf(corrente) + i) % BIOPLASTICHE.length];
      const c = creaCubo(bio);
      c.position.y = i * S;
      c.rotation.y = i * 0.12 * (i % 2 ? 1 : -1); // leggero sfalsamento, come impilate a mano
      lampada.add(c);
      return c;
    });
    macchiaMuro.position.y = (n - 1) * S / 2;
    macchiaMuro.scale.set(1, n > 1 ? 1.5 : 1, 1);
    inquadra();
    aggiornaLuce();
  }

  // tutto quello che dipende da accesa/intensità/colore
  function aggiornaLuce() {
    const k = accesa ? intensita : 0;
    cubi.forEach(c => c.userData.bioMat.color.setScalar(0.22 + 0.78 * k));
    fessuraMat.color.copy(buio).lerp(coloreLuce, k * 0.55);
    // con la lampada spenta la stanza è un po' più illuminata, come di giorno
    ambiente.intensity = 1.1 + (1 - k) * 0.4;
    aggiornaRiflessi();
    render();
  }

  // il muro e il pavimento seguono l'orientamento delle finestre
  const normale = new THREE.Vector3();
  function aggiornaRiflessi() {
    const k = accesa ? intensita : 0;
    normale.set(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), lampada.rotation.y);
    // quanto una delle due finestre guarda il muro (dietro, -z)
    const versoMuro = Math.abs(normale.z);
    muroMat.opacity = 0.75 * k * Math.pow(versoMuro, 1.4);
    // la macchia si sposta un po' verso il lato in cui punta la finestra
    macchiaMuro.position.x = -normale.x * Math.sign(normale.z || 1) * 14;
    pavimentoMat.forEach(m => m.opacity = 0.4 * k);
  }

  // il colore della luce viene dalla media della texture
  function coloreMedio(src) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = c.height = 8;
        const x = c.getContext("2d"); x.drawImage(img, 0, 0, 8, 8);
        const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
        res([r, g, b].map(v => v / 64 / 255));
      };
      img.src = src;
    });
  }
  function impostaColore([r, g, b]) {
    coloreLuce.setRGB(r, g, b, THREE.SRGBColorSpace);
    // satura un po' il colore: la luce attraverso la bioplastica è più viva della foto
    const hsl = {}; coloreLuce.getHSL(hsl); coloreLuce.setHSL(hsl.h, Math.min(1, hsl.s * 1.3), Math.min(0.6, hsl.l));
    muroMat.color.copy(coloreLuce);
    pavimentoMat.forEach(m => m.color.copy(coloreLuce));
    aggiornaLuce();
  }

  // ---- UI ----
  const col = document.getElementById("colori");
  STRUTTURE.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "swatch colore";
    btn.style.background = "#" + s.colore.toString(16).padStart(6, "0");
    btn.setAttribute("aria-label", `Struttura ${s.id}`);
    btn.setAttribute("aria-pressed", i === 0);
    btn.onclick = () => {
      col.querySelectorAll(".swatch").forEach(b => b.setAttribute("aria-pressed", b === btn));
      impostaStruttura(s);
    };
    col.append(btn);
  });

  const sw = document.getElementById("swatches");
  BIOPLASTICHE.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "swatch";
    btn.style.backgroundImage = `url(${b.src})`;
    btn.setAttribute("aria-label", `Bioplastica ${b.id}`);
    btn.setAttribute("aria-pressed", b === corrente);
    btn.onclick = async () => {
      corrente = b;
      sw.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", s === btn));
      costruisci(stackBtn.getAttribute("aria-pressed") === "true");
      impostaColore(await coloreMedio(b.src));
    };
    sw.append(btn);
  });

  const powerBtn = document.getElementById("power");
  powerBtn.onclick = () => {
    accesa = !accesa;
    powerBtn.setAttribute("aria-pressed", accesa);
    powerBtn.textContent = accesa ? "Accesa" : "Spenta";
    aggiornaLuce();
  };

  const slider = document.getElementById("intensita");
  slider.oninput = () => {
    intensita = slider.value / 100;
    slider.style.setProperty("--v", slider.value + "%");
    // alzare l'intensità a lampada spenta la riaccende
    if (!accesa && intensita > 0) powerBtn.click();
    else aggiornaLuce();
  };

  const stackBtn = document.getElementById("stack");
  stackBtn.onclick = () => {
    const on = stackBtn.getAttribute("aria-pressed") !== "true";
    stackBtn.setAttribute("aria-pressed", on);
    costruisci(on);
  };

  // ---- Rotazione: si gira la lampada, non la camera (il muro resta dietro) ----
  let velocita = reduceMotion ? 0 : 0.0025;
  const AUTO = velocita;
  let trascinando = false, ultimoX = 0, ultimoT = 0, inattivo = 0;
  canvas.addEventListener("pointerdown", e => {
    trascinando = true; ultimoX = e.clientX; ultimoT = performance.now();
    canvas.setPointerCapture(e.pointerId);
    document.querySelector(".hint").style.opacity = 0;
    avvia();
  });
  canvas.addEventListener("pointermove", e => {
    if (!trascinando) return;
    const dx = e.clientX - ultimoX, now = performance.now();
    lampada.rotation.y += dx * 0.008;
    velocita = (dx * 0.008) / Math.max(1, (now - ultimoT) / 16);
    ultimoX = e.clientX; ultimoT = now;
  });
  const rilascia = () => { trascinando = false; inattivo = 0; };
  canvas.addEventListener("pointerup", rilascia);
  canvas.addEventListener("pointercancel", rilascia);

  // distanza della camera: tutta la lampada (1 o 3 cubi) deve stare nello schermo,
  // anche in verticale su telefono, lasciando spazio ai pulsanti in basso
  function inquadra() {
    const altezza = cubi.length * S + 8;
    const larghezza = S * 1.6 + 8;
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const perAltezza = (altezza / 0.55) / (2 * Math.tan(fov / 2));
    const perLarghezza = (larghezza / 0.7) / (2 * Math.tan(fov / 2) * camera.aspect);
    const d = Math.max(perAltezza, perLarghezza);
    const centroY = (cubi.length - 1) * S / 2;
    camera.position.set(0, centroY + d * 0.26, d);
    // il punto guardato è un po' sotto il centro: la lampada sale e lascia spazio ai pulsanti
    camera.lookAt(0, centroY - altezza * 0.12, 0);
    render();
  }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    inquadra();
  }
  function render() { renderer.render(scene, camera); }

  // ---- Animazione: gira solo se visibile e se c'è movimento ----
  let visibile = true, raf = 0;
  function frame() {
    raf = 0;
    if (!visibile) return;
    if (!trascinando) {
      lampada.rotation.y += velocita;
      // dopo un lancio la lampada rallenta e torna alla rotazione lenta
      velocita += (AUTO - velocita) * 0.04;
    }
    aggiornaRiflessi();
    render();
    if (trascinando || Math.abs(velocita) > 1e-5) raf = requestAnimationFrame(frame);
  }
  function avvia() { if (!raf) raf = requestAnimationFrame(frame); }

  new IntersectionObserver(([e]) => { visibile = e.isIntersecting; if (visibile) avvia(); }).observe(canvas);
  document.addEventListener("visibilitychange", () => { visibile = !document.hidden; if (visibile) avvia(); });

  addEventListener("resize", resize);
  lampada.rotation.y = -0.6;
  impostaStruttura(STRUTTURE[0]);
  costruisci(false);
  coloreMedio(corrente.src).then(impostaColore);
  resize();
  avvia();
</script>
</body>
</html>
